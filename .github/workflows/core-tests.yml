name: WRXLogCore Tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests
    runs-on: macos-15
    timeout-minutes: 10

    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Run core tests
        run: swift test --package-path WRXLogCore
